// Written for the DGX Spark log, 2026-09-07 — x87 FPU diagnostic run.
//
// WHY: id Tech 4 dies with "the FPU stack is not empty at the end of the frame".
// DOOM 3, DOOM 3 BFG and Prey have all hit that on this rig and nobody has ever
// read the diagnostic the engine prints ONE LINE EARLIER. Quake 4's dump is the
// richest of the family — verified present in Quake4.exe:
//     CTRL/STAT/TAGS/INOF/INSE/OPOF/OPSE, ST0..ST7, "num values on stack = %d"
// INOF is the x87 instruction pointer: it names the last x87 instruction executed.
// If FEX does not populate FIP/FDP on fnstenv (JITs frequently skip them), INOF
// reads 0 — and that is itself the answer.
//
// Quake4.exe also carries a SECOND assertion DOOM 3 lacks, in gamex86.dll:
//     "idGameLocal::CalcFov: FPU stack not empty"
// which names a specific function rather than "the frame".
//
// logFile 2 = log to file AND FLUSH EVERY WRITE. Without the flush the last lines
// are lost in the crash — precisely the lines we need.
seta logFile "2"
seta logFileName "qconsole.log"
seta com_showFPS "1"
seta com_allowConsole "1"
// pinned explicitly so the run has no unrecorded variable; 0 is the stock default
seta win_enableFPUExceptions "0"
